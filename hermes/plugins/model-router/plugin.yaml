name: model-router
version: 0.5.0
description: >-
  Complexity-based model routing (terra/sol/astra for the orchestrator, GPT 6.1+ Terra floor,
  opus/fable for delegated coding) and fail-closed privacy routing that keeps
  #privacy-marked requests off cloud providers. Optional deterministic specialist-router
  pilot (off by default) that suggests book-backed profiles per task.
author: agent-ops-kit
kind: standalone
requires_hermes: ">=0.21"
# Hermes 0.21+ manifest schema: middleware capabilities are declared under
# `provides_middleware` (validated by `hermes plugins validate` and surfaced in
# `hermes plugins show`). register() is what actually wires them via
# ctx.register_middleware; this block is the matching declaration.
provides_middleware:
  - llm_request
  - llm_execution
# Specialist-router pilot: pre_llm_call is registered only when
# specialist_routing is true in the orchestrator profile (validate warns
# "declared but not added" while it is off). register() also adds the
# /route-specialists dry-run command.
provides_hooks:
  - pre_llm_call
