# BrowserOS neo pilot: one dedicated browser profile that a human signs in to
# over noVNC and Hermes drives over MCP. Run it through scripts/browseros-neo.sh
# (make browseros-neo-up), which checks the rendered config before starting.
#
# Upstream: github.com/browseros-ai/BrowserOS packages/browseros/docker/neo.
# The image is pinned by digest; see docs/browseros-neo.md for its identity.
#
# Neither upstream port has authentication. This file therefore:
#   - publishes only on 127.0.0.1 (hard-coded, not an env setting);
#   - never publishes Neo's 9010 itself; Hermes reaches it through `mcp-gate`,
#     a plain forwarder that `browseros-neo.sh pause` stops to cut the agent off
#     while the human keeps the viewer;
#   - keeps the data folder out of any other container;
#   - publishes the viewer through `viewer`, a second websockify (from the
#     same pinned image) that refuses a WebSocket whose Origin is not exactly
#     http://127.0.0.1:<viewer port>. The image's own websockify on 6080 has
#     no Origin check (websockify 0.10.0, no --auth-plugin), so a web page in
#     the operator's browser could otherwise open ws://127.0.0.1:<port> and
#     drive the desktop. Neo's own 6080 is replaced by websockify-6080
#     (loopback only, every WebSocket refused), and chromium-policy.json
#     blocks pages from reaching Neo's loopback ports at all;
#     docs/browseros-neo.md ("Login status") lists what this does not cover.
name: browseros-neo

x-neo-image: &neo-image "ghcr.io/browseros-ai/neo:0.52.1.2-d32f6ab@sha256:9f6302905f4db0d7d58a13e00b74cfc5c4448c5a7517a36700581a48e102d72e"

services:
  neo:
    image: *neo-image
    init: false # the image runs tini itself
    hostname: neo
    shm_size: 1g
    stop_grace_period: 20s
    ports:
      # The viewer port belongs to `viewer` (network_mode service:neo), which
      # listens on 6081 in Neo's namespace; Neo's own 6080 is not published.
      - "127.0.0.1:${BROWSEROS_NEO_VNC_PORT:-16080}:6081"
    volumes:
      - "${BROWSEROS_NEO_DATA:?set by scripts/browseros-neo.sh}:/data"
      - "./neo.toml:/etc/neo/neo.toml:ro"
      # Shadows the image's /usr/bin/websockify on PATH: Neo's own 6080 binds
      # 127.0.0.1 and refuses every WebSocket upgrade (websockify-6080).
      - "./websockify-6080:/usr/local/bin/websockify:ro"
      # Managed Chromium policy: pages on public/other addresses cannot reach
      # Neo's loopback ports, and no tab or extension comes back on restart.
      - "./chromium-policy.json:/etc/chromium/policies/managed/agent-ops-kit.json:ro"
    environment:
      PUID: "${BROWSEROS_NEO_UID:?set by scripts/browseros-neo.sh}"
      PGID: "${BROWSEROS_NEO_GID:?set by scripts/browseros-neo.sh}"
      NEO_SCREEN: 1600x1000
      BROWSERCLAW_HOSTED_MODE: "1"
      NEO_SANDBOX: "false"
      NEO_SOFTWARE_GRAPHICS: "true"
      NEO_DISABLE_BROWSEROS_EXTENSIONS: "true"
      NEO_ARGS: ""
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The entrypoint starts as root, prepares /data and /tmp/.X11-unix, then
    # drops every process to the neo user with setpriv.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    pids_limit: 2048
    mem_limit: 4g
    cpus: 2
    networks: [neo]
    restart: "no"

  mcp-gate:
    image: *neo-image
    entrypoint: ["/usr/bin/python3", "-I", "/gate/mcp-gate.py", "9010", "neo", "9010"]
    user: "65534:65534"
    read_only: true
    ports:
      - "127.0.0.1:${BROWSEROS_NEO_MCP_PORT:-19010}:9010"
    volumes:
      - "./mcp-gate.py:/gate/mcp-gate.py:ro"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 128m
    healthcheck:
      disable: true
    depends_on:
      neo:
        condition: service_healthy
    networks: [neo]
    restart: "no"

  viewer:
    image: *neo-image
    # websockify 0.10.0's ExpectOrigin plugin rejects the WebSocket upgrade
    # (403) unless Origin equals one listed source. Static noVNC files are
    # still served to anyone who reaches the port; they hold no secrets.
    entrypoint:
      - /usr/bin/python3
      - -I
      - -m
      - websockify
      - --web
      - /usr/share/novnc
      - --auth-plugin
      - websockify.auth_plugins.ExpectOrigin
      - --auth-source
      - "http://127.0.0.1:${BROWSEROS_NEO_VNC_PORT:-16080}"
      - "6081"
      - localhost:5900
    user: "65534:65534"
    read_only: true
    network_mode: "service:neo"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      disable: true
    depends_on:
      neo:
        condition: service_healthy
    restart: "no"

networks:
  neo: {}
