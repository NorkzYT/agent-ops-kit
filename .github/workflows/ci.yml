name: ci

# The kit imposes a build/test/confirm loop on target repos — this applies the
# same loop to the kit itself: every bash entrypoint must parse, and the two
# E2E suites (eval harness plumbing, wt worktree manager) must pass.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-syntax:
    name: Shell syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script with a bash shebang
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            head -c 64 "$f" | head -n 1 | grep -qE '^#!.*(bash|/sh)' || continue
            if ! bash -n "$f" 2>/tmp/err; then
              echo "SYNTAX FAIL: $f"; cat /tmp/err; fail=1
            fi
          done < <(find . -path ./.git -prune -o -type f -print0)
          exit "$fail"

  eval-harness:
    name: Eval harness E2E (test_eval.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash .claude/eval/test_eval.sh

  worktree:
    name: wt worktree manager E2E (test_worktree.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .claude/scripts/test_worktree.sh

  self-update:
    name: self-update E2E (test_self_update.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .claude/scripts/test_self_update.sh

  guard:
    name: bash guard hook (test_guard.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .claude/scripts/test_guard.py

  stack:
    name: Stack config (compose, Hermes templates, JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          sed -i 's/^CLIPROXY_API_KEY=$/CLIPROXY_API_KEY=ci/; s/^CLIPROXY_MANAGEMENT_KEY=$/CLIPROXY_MANAGEMENT_KEY=ci/' .env
          mkdir -p vendor/claude-max-api-proxy && printf 'FROM scratch\n' > vendor/claude-max-api-proxy/Dockerfile
          docker compose config -q
      - name: Hermes templates and JSON parse
        run: |
          python3 - <<'PY'
          import json, pathlib, re, yaml
          for f in ["hermes/config.yaml.tmpl", "docker/cliproxyapi/config.example.yaml"]:
              yaml.safe_load(re.sub(r"__[A-Z0-9_]+__", "x", pathlib.Path(f).read_text()))
          json.loads(re.sub(r"__[A-Z0-9_]+__", "x", pathlib.Path("hermes/honcho.json.tmpl").read_text()))
          json.loads(pathlib.Path(".claude/settings.local.json").read_text())
          json.loads(pathlib.Path(".claude/settings.json").read_text())
          print("templates ok")
          PY
      - name: stack-init renders config offline
        run: |
          rm -f .env; CLAUDE_MAX_PROXY_REPO=file:///nonexistent bash scripts/stack-init.sh || true
          test -f data/cliproxyapi/config.yaml && ! grep -q __CLIPROXY_API_KEY__ data/cliproxyapi/config.yaml
