name: ci

# The kit imposes a build/test/confirm loop on target repos — this applies the
# same loop to the kit itself: every bash entrypoint must parse, and the two
# E2E suites (eval harness plumbing, wt worktree manager) must pass.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-syntax:
    name: Shell syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script with a bash shebang
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            head -c 64 "$f" | head -n 1 | grep -qE '^#!.*(bash|/sh)' || continue
            if ! bash -n "$f" 2>/tmp/err; then
              echo "SYNTAX FAIL: $f"; cat /tmp/err; fail=1
            fi
          done < <(find . -path ./.git -prune -o -type f -print0)
          exit "$fail"

  eval-harness:
    name: Eval harness E2E (test_eval.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash .claude/eval/test_eval.sh

  worktree:
    name: wt worktree manager E2E (test_worktree.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .claude/scripts/test_worktree.sh

  self-update:
    name: self-update E2E (test_self_update.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .claude/scripts/test_self_update.sh

  guard:
    name: bash guard hook (test_guard.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .claude/scripts/test_guard.py

  stack:
    name: Stack config (compose, Hermes templates, JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          sed -i "s/^CLIPROXY_API_KEY=$/CLIPROXY_API_KEY=ci/; s/^CLIPROXY_MANAGEMENT_KEY=$/CLIPROXY_MANAGEMENT_KEY=ci/; s/^HONCHO_DB_PASSWORD=$/HONCHO_DB_PASSWORD=ci/; s#^REPOS_DIR=.*#REPOS_DIR=$RUNNER_TEMP/repos#" .env
          docker compose config -q
      - name: Hermes templates and JSON parse
        run: |
          python3 - <<'PY'
          import json, pathlib, re, yaml
          for f in ["hermes/config.yaml.tmpl", "docker/cliproxyapi/config.example.yaml"]:
              yaml.safe_load(re.sub(r"__[A-Z0-9_]+__", "x", pathlib.Path(f).read_text()))
          json.loads(re.sub(r"__[A-Z0-9_]+__", "x", pathlib.Path("hermes/honcho.json.tmpl").read_text()))
          json.loads(pathlib.Path(".claude/settings.local.json").read_text())
          json.loads(pathlib.Path(".claude/settings.json").read_text())
          print("templates ok")
          PY
      - name: stack-init renders config offline and generates the proxy key
        run: |
          rm -f .env; CLAUDE_MAX_PROXY_REPO=file:///nonexistent bash scripts/stack-init.sh || true
          test -f data/cliproxyapi/config.yaml && ! grep -q __CLIPROXY_API_KEY__ data/cliproxyapi/config.yaml
          grep -qE '^CLAUDE_MAX_PROXY_API_KEY=.+' .env
      - name: vendored proxy sync degrades to the vendored copy offline
        run: |
          test -f vendor/claude-max-api-proxy/UPSTREAM && ! test -e vendor/claude-max-api-proxy/.git
          out="$(CLAUDE_MAX_PROXY_REPO=https://127.0.0.1:9/gone.git bash scripts/claude-max-proxy/sync-upstream.sh --check)"
          echo "$out"; grep -q 'using the vendored copy' <<<"$out"
          out="$(CLAUDE_MAX_PROXY_REPO=https://127.0.0.1:9/gone.git bash scripts/claude-max-proxy/sync-upstream.sh)"
          echo "$out"; grep -q 'using the vendored copy' <<<"$out"
          git diff --quiet -- vendor/
      - name: claude-max-proxy unit and proxy.env render offline
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          sed -i "s#^REPOS_DIR=.*#REPOS_DIR=$RUNNER_TEMP/repos#" .env
          bash scripts/claude-max-proxy/install.sh --render-only
          unit="$HOME/.config/systemd/user/claude-max-proxy.service"
          test -f "$unit" && ! grep -q '__[A-Z_]*__' "$unit"
          grep -q '^CPUQuota=400%$' "$unit" && grep -q '^MemoryMax=12G$' "$unit"
          test -f data/claude-max-proxy/proxy.env && grep -q '^CLAUDE_PROXY_MAX_CONCURRENT_REQUESTS=3$' data/claude-max-proxy/proxy.env
          grep -q '^HOST=127.0.0.1$' data/claude-max-proxy/proxy.env
          grep -qE '^CLAUDE_MAX_PROXY_API_KEY=.+' data/claude-max-proxy/proxy.env

  claude-max-proxy:
    name: claude-max-proxy builds and tests from the vendored sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the vendored proxy
        run: cd vendor/claude-max-api-proxy && npm ci --no-audit --no-fund && npm run build && test -f dist/server/standalone.js
      - name: Run the vendored proxy test suite (auth/CORS/queue regressions)
        run: cd vendor/claude-max-api-proxy && npm test

  shellcheck:
    name: ShellCheck (touched operator scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure shellcheck
        run: command -v shellcheck || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)
      - name: Lint
        run: |
          shellcheck -x --severity=warning \
            scripts/lib.sh scripts/stack-init.sh scripts/doctor.sh scripts/hermes-install.sh \
            scripts/envval.sh scripts/models.sh scripts/hermes-ui.sh scripts/auth-claude-proxy.sh \
            scripts/hermes-profile.sh scripts/knowledge-sync.sh scripts/claude-max-proxy/install.sh \
            scripts/test_hermes_ui.sh scripts/test_healthcheck.sh scripts/test_hermes_install.sh \
            scripts/test_stack_render.sh scripts/test_knowledge_sync.sh scripts/test_hermes_profile.sh \
            scripts/test_windows_worker_install.sh \
            scripts/test_windows_chrome_devtools_mcp.sh \
            install.sh .claude/scripts/test_install.sh \
            .claude/bootstrap/linux_devtools.sh

  shell-tests:
    name: Make targets, installer, healthcheck, render, hermes-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test_hermes_ui.sh
      - run: bash scripts/test_healthcheck.sh
      - run: bash scripts/test_stack_render.sh
      - run: bash scripts/test_hermes_install.sh
      - run: bash scripts/test_knowledge_sync.sh
      - run: bash scripts/test_hermes_profile.sh
      - run: bash scripts/test_windows_worker_install.sh
      - run: bash scripts/test_windows_chrome_devtools_mcp.sh
      - run: bash .claude/scripts/test_install.sh
